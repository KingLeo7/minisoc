# MiniSOC Detection Thresholds & Settings
# Tune these constants to match your network baseline traffic

# Alert deduplication cooldown in milliseconds (default: 30000 = 30 seconds)
alert.cooldown.ms=30000

# SSH Brute Force Detector
ssh.max_failures=5
ssh.window_ms=60000

# Suricata Flow Port Scan Detector
portscan.threshold=15
portscan.window_ms=10000

# DNS Exfiltration Detector
dns.label_length_threshold=32
dns.burst_threshold=8
dns.window_ms=20000

# Sound alerts enabled (true/false)
sound.alerts.enabled=true

